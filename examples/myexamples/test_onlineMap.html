<!DOCTYPE html>
<html>
	<head>
		<title>three.js test - 加载网络地图</title>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
		/>
		<link type="text/css" rel="stylesheet" href="../main.css" />
		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
			}
			canvas {
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<canvas id="container"></canvas>
		<script type="importmap">
			{
				"imports": {
					"three": "../../build/three.module.js"
				}
			}
		</script>
		<script type="module">
			import * as THREE from "three";
			import { MapControls } from "../jsm/controls/MapControls.js";
			import MapHelper from "./test_onlineMap/MapHelper.js";

			let scene, camera, renderer, controls, mapHelper;

			init();
			requestAnimationFrame(animate);

			function init() {
				const canvas = document.getElementById("container");
				// scene

				scene = new THREE.Scene();
				window._scene = scene;

				// camera

				camera = new THREE.PerspectiveCamera(
					60,
					canvas.clientWidth / canvas.clientHeight,
					0.1,
					1e10
				);
				camera.position.set(0, 0.7, 1);
				camera.lookAt(new THREE.Vector3(0, 0, 0));

				// renderer

				renderer = new THREE.WebGLRenderer({
					antialias: true,
					canvas,
				});
				renderer.setSize(canvas.clientWidth, canvas.clientHeight);
				renderer.setPixelRatio(window.devicePixelRatio);

				// control

				const controls = new MapControls(camera, renderer.domElement);
				controls.minDistance = 0.1;

				// map
				mapHelper = new MapHelper({ scene });
				mapHelper.loadMap(120, 30);

				// resize

				window.addEventListener("resize", onWindowResize);
			}

			function animate(t) {
				requestAnimationFrame(animate);

				render(t);
			}

			function render(now) {
				renderer.render(scene, camera);
			}

			function onWindowResize() {
				const width = renderer.domElement.parentElement.clientWidth;
				const height = renderer.domElement.parentElement.clientHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize(width, height);
			}
		</script>
	</body>
</html>
