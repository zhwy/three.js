			function init() {

					});

			function onWindowResize() {
				const width = renderer.domElement.parentElement.clientWidth;
				const height = renderer.domElement.parentElement.clientHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();

				renderer.setSize(width, height);
				labelRenderer.setSize(width, height);

				sky.material.uniforms.u_resolution.value.set(width, height);
			}

			function animate(t) {
				requestAnimationFrame(animate);

				render(t);
			}

			function render(now) {
				now *= 0.001;

				if (sky) {
					sky.material.uniforms.u_time.value = now;
				}

				light.position.copy(camera.position);

				renderer.render(scene, camera);
				labelRenderer.render(scene, camera);
			}

			function getMercator(lng, lat) {
				const mercator = {};
				const earthRad = 6378137.0;
				mercator.x = ((lng * Math.PI) / 180) * earthRad;
				const a = (lat * Math.PI) / 180;
				mercator.y =
					(earthRad / 2) * Math.log((1.0 + Math.sin(a)) / (1.0 - Math.sin(a)));
				return mercator;
			}

			function createGeometry(feature) {
				const processSinglePolygon = (coordinates) => {
					const mercs = coordinates[0].map((coord) =>
						getMercator(coord[0], coord[1])
					);

					const shape = new THREE.Shape();
					shape.moveTo(mercs[0].x, mercs[0].y);
					for (let i = 1; i < mercs.length; i += 1) {
						shape.lineTo(mercs[i].x, mercs[i].y);
					}

					// 挖洞
					const holes = coordinates.slice(1).map((coords) => {
						const path = new Path();
						const mercs = coords.map((coord) =>
							getMercator(coord[0], coord[1])
						);
						path.moveTo(mercs[0].x, mercs[0].y);
						for (let i = 1; i < mercs.length; i += 1) {
							path.lineTo(mercs[i].x, mercs[i].y);
						}

						return path;
					});

					shape.holes.push(...holes);

					return shape;
				};

				let shape;

				if (feature.geometry.type === "Polygon") {
					shape = processSinglePolygon(feature.geometry.coordinates);
				} else if (feature.geometry.type === "MultiPolygon") {
					shape = feature.geometry.coordinates.map((coords) =>
						processSinglePolygon(coords)
					);
				} else {
					throw new Error(`暂不支持几何类型是${feature.geometry.type}的地块`);
				}

				const geometry = new THREE.ExtrudeGeometry(shape, {
					depth: 0.05,
					bevelEnabled: false,
				});
				geometry.computeBoundingBox();
				const maxLength = Math.max(
					geometry.boundingBox.max.x - geometry.boundingBox.min.x,
					geometry.boundingBox.max.y - geometry.boundingBox.min.y
				);
				geometry.translate(
					-geometry.boundingBox.min.x,
					-geometry.boundingBox.min.y,
					0
				);
				geometry.scale(1 / maxLength, 1 / maxLength, 1);

				// 更改uv
				const { uv, position, normal } = geometry.attributes;
				for (let i = 0; i < uv.count; i += 1) {
					if (normal.getZ(i) === 1) {
						const x = position.getX(i);
						const y = position.getY(i);
						uv.setXY(i, x, y);
					} else {
						uv.setXY(i, 0, 0);
					}
				}

				geometry.translate(
					-geometry.boundingBox.max.x / 2,
					-geometry.boundingBox.max.y / 2,
					0
				);

				geometry.rotateX(-Math.PI / 2);

				return geometry;
			}

			function initSky() {
				const noise = textureLoader.load("../textures/noise.png");
				noise.wrapS = THREE.RepeatWrapping;
				noise.wrapT = THREE.RepeatWrapping;
				const params = {
					uniforms: {
						u_time: { value: 0 },
						u_resolution: {
							value: new THREE.Vector2(
								renderer.domElement.clientWidth,
								renderer.domElement.clientHeight
							),
						},
						u_noise: {
							value: noise,
						},
						u_sunPosition: {
							value: new THREE.Vector3(0, 1, 1),
						},
						u_skyColor: {
							value: new THREE.Color(0x0255c3),
						},
						u_groundColor: {
							value: new THREE.Color(0x777777),
						},
					},
					vertexShader: SkyShader.vert,
					fragmentShader: SkyShader.frag,
					depthTest: false,
				};

				const skyGeom = new THREE.PlaneGeometry(2, 2);
				const skyMat = new THREE.ShaderMaterial(params);

				sky = new THREE.Mesh(skyGeom, skyMat);
				scene.add(sky);
			}

			function loadModel(modelUrl, bounding) {
				const { min, max } = bounding;
				const datas = [];
				const rayCaster = new THREE.Raycaster();
				for (let i = min.x + 0.1; i <= max.x - 0.1; i += 0.1) {
					for (let j = min.z + 0.1; j <= max.z - 0.1; j += 0.1) {
						rayCaster.set(
							new THREE.Vector3(i, 0.5, j),
							new THREE.Vector3(0, -1, 0)
						);
						const test = rayCaster.intersectObject(mesh, false);
						if (test.length) {
							datas.push({
								position: new THREE.Vector3(i, 0.05, j),
								rotation: new THREE.Euler(0, Math.random() * Math.PI, 0),
								scale: new THREE.Vector3(1, 1, 1),
							});
						}
					}
				}

				const loader = new GLTFLoader();
				loader.load(modelUrl, (gltf) => {
					const group = new THREE.Object3D();
					group.name = "isntanced-model";
					scene.add(group);

					gltf.scene.traverse((node) => {
						if (node.isMesh) {
							// const defaultTransform = new THREE.Matrix4().makeRotationX(
							//   -Math.PI / 2,
							// );
							// node.geometry.applyMatrix4(defaultTransform);
							const model = new THREE.InstancedMesh(
								node.geometry,
								node.material,
								datas.length
							);

							// model.castShadow = true;
							// model.receiveShadow = true;

							const dummy = new THREE.Object3D();
							datas.forEach((data, i) => {
								dummy.position.copy(data.position);
								dummy.rotation.copy(data.rotation);
								dummy.scale.copy(data.scale);
								dummy.updateMatrix();
								model.setMatrixAt(i, dummy.matrix);
							});

							group.add(model);
						}
					});
				});
			}
